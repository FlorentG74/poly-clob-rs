[package]
name = "poly-clob-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0" }
reqwest = { version = "0.12.9", features = ["default-tls"] }
reqwest-websocket = "0.4.2"
futures = { version = "0.3" }
serde_json = "1.0"
tokio = { version = "1.40.0", features = ["macros"] }
dotenv = "0.15.0"
string-builder = "0.2.0"
hex = { version = "0.4.3" }
chrono = { version = "0.4.38" }
sha2 = { version = "0.10.8" }
hmac = "0.12.1"
base64 = { version = "0.22.1" }
strum_macros = "0.27.2"
alloy = { version = "0.5.4", features = ["dyn-abi", "signer-local"] }
strum = { version = "0.27.2" }
log = "0.4.22"
env_logger = { version = "0.11.5" }
regex = "1.11.1"

[package.metadata.cargo-machete]
ignored = ["strum"]

[build-dependencies]
