[package]
name = "poly-clob-rs"
version = "0.1.0"
edition = "2024"
authors = ["Florent <FlorentG74@proton.me>"]
description = "A Rust client library for the Polymarket CLOB (Central Limit Order Book) API"
license = "MIT OR Apache-2.0"
repository = "https://github.com/FlorentG74/poly-clob-rs"
homepage = "https://github.com/FlorentG74/poly-clob-rs"
documentation = "https://docs.rs/poly-clob-rs"
readme = "README.md"
keywords = ["polymarket", "prediction-markets", "clob", "api", "blockchain"]
categories = ["api-bindings", "web-programming::http-client", "cryptography::cryptocurrencies"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
rust_decimal = { workspace = true }
alloy = { workspace = true, features = ["dyn-abi", "signer-local"] }

reqwest = { workspace = true }
reqwest-websocket = "0.6.0"
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
dotenvy = "0.15"
hex = { version = "0.4.3" }
sha2 = { version = "0.11" }
hmac = "0.13"
base64 = { version = "0.23.1" }
typed-builder = "0.23"
rand = { workspace = true }
diesel = { version = "2.3.9", features = ["postgres"], optional = true }
hickory-resolver = { version = "0.26", features = ["tokio"] }

[dev-dependencies]
http = "1"

[features]
default = []
with-diesel = ["diesel"]

# Documentation lints. These live in `clippy::pedantic`, so they are off under a plain
# `cargo clippy`; promoting them to `warn` is deliberate — the crate has been brought to
# zero on all five, and warning by default is what keeps it there.
#
# Deliberately a self-contained table rather than `[lints] workspace = true`: this crate is
# consumed as a git submodule of polytrader but is its own repository, so it must not depend
# on a parent workspace for its lint config. The parent carries an identical table in its
# `[workspace.lints.clippy]` — keep the two in sync.
[lints.clippy]
doc_markdown = "warn"                 # identifiers in prose must be in backticks
must_use_candidate = "warn"           # pure fns returning a value get #[must_use]
missing_errors_doc = "warn"           # public fallible fns document their `# Errors`
missing_panics_doc = "warn"           # public fns that can panic document their `# Panics`
too_long_first_doc_paragraph = "warn" # doc comments open with a one-line summary

# [package.metadata.cargo-machete]
# ignored = ["strum"]
